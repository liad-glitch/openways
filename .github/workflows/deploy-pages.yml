name: Deploy OpenWays to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build (static export target)
        run: bun run build
        env:
          STATIC_EXPORT: "1"
      - name: Prerender static site
        run: node scripts/static-export.mjs
        env:
          STATIC_EXPORT: "1"
          PAGES_CNAME: openwayssg.com
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public
      - name: Deploy
        uses: actions/deploy-pages@v4
